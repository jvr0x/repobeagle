name: image
on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1"   # weekly (Mon 04:17 UTC): refresh scanners + rules
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh vendored Semgrep rules (best effort)
        run: |
          for p in security-audit secrets; do
            curl -fsSL "https://semgrep.dev/c/p/$p" -o "rules/vendor/$p.yml.new" && mv "rules/vendor/$p.yml.new" "rules/vendor/$p.yml" || true
          done
      - id: date
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/repobeagle
          tags: |
            type=raw,value=latest
            type=sha
            type=raw,value=${{ steps.date.outputs.week }}
            type=ref,event=tag
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (amd64, offline, trap fixture must be RED)
        run: |
          mkdir -p /tmp/out
          docker run --rm --network none --read-only --tmpfs /tmp -v "$PWD/tests/fixtures/trap-npm:/src:ro" -v /tmp/out:/out \
            --user 0 ghcr.io/${{ github.repository_owner }}/repobeagle:latest /src /out
          python3 -c "import json;d=json.load(open('/tmp/out/inner.json'));c=[f for f in d['findings'] if f['severity']=='critical'];print(len(c),'critical');assert c"
